name: Release

# Two ways to release:
#   1. Push a tag such as v0.1.0.
#   2. Actions tab > Release > Run workflow, and type the version (e.g. 0.1.0).
#      The workflow creates the tag for you.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0). Must match app/__init__.py."
        required: true

permissions:
  contents: write  # create the GitHub release
  packages: write  # push the image to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/haven
  # Tag for this release, whichever way it was started.
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Check the tag matches the version in the code
        run: |
          code_version=$(python -c "import app; print(app.__version__)")
          test "v${code_version}" = "${TAG}" || {
            echo "Tag ${TAG} does not match app.__version__ ${code_version}"; exit 1; }
      - run: |
          pip install -r requirements-dev.txt
          python -m spacy download en_core_web_lg
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out tags
        id: tags
        run: |
          version="${TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
      - name: Build and push (Intel/AMD and ARM)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.minor }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Local proxy that removes patient details from AI prompts
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Pull and run the published image
        run: |
          docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          docker run -d --name haven -p 127.0.0.1:8787:8787 \
            -e OPENAI_API_KEY=sk-dummy -e HAVEN_OPENAI_BASE_URL=http://127.0.0.1:9 \
            "${IMAGE}:${TAG#v}"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8787/health | grep -q "\"version\":\"${TAG#v}\""
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"x","messages":[{"role":"user","content":"Siobhán Kavanagh, DOB 04/12/1982"}]}')
          test "$code" = "502"
          curl -s http://127.0.0.1:8787/haven/audit | grep -q '"PERSON": 1\|"PERSON":1'

  github-release:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          # Take this version's section of CHANGELOG.md as the release notes.
          awk -v v="$version" '
            $0 ~ "^## "v { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ### Run it

          \`\`\`
          docker run -d --name haven -p 127.0.0.1:8787:8787 --env-file .env -v haven-data:/data ${IMAGE}:${version}
          \`\`\`
          EOF
          prerelease=""
          case "$version" in 0.*) prerelease="--prerelease" ;; esac
          # --target creates the tag on this commit if it doesn't exist yet (manual runs).
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Haven ${version}" \
            --notes-file notes.md $prerelease
